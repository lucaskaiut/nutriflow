# Gera o APK instalável do app (sem EAS): expo prebuild + Gradle no runner do GitHub.
#
# Disparo: tag "v*" (ex.: v1.0.0 → cria uma Release com o APK) ou manualmente (Actions → Run workflow).
# Assinatura: com os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e
# ANDROID_KEY_PASSWORD o APK é assinado com a chave de release. Sem eles, sai assinado com a chave de
# debug do template (instala normalmente, mas não serve para publicar nem para atualizar um APK de release).
# A URL da API vem da variável de repositório EXPO_PUBLIC_API_URL (padrão: produção).
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://nutriflow-api.noxtecnologias.com.br/api' }}
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Dependências
        run: npm ci

      - name: Versão (tag → versionName, número da execução → versionCode)
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const ref = process.env.GITHUB_REF_NAME || "";
            if (/^v\d+\.\d+\.\d+/.test(ref)) cfg.expo.version = ref.slice(1);
            cfg.expo.android = { ...cfg.expo.android, versionCode: Number(process.env.GITHUB_RUN_NUMBER) };
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
            console.log("version", cfg.expo.version, "versionCode", cfg.expo.android.versionCode);
          '

      - name: Gerar projeto Android (prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK de release
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Assinar
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release.apk
          VERSION=$(node -p 'require("./app.json").expo.version')
          mkdir -p ../dist
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/release.jks"
            OUT="../dist/nutriflow-${VERSION}.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$OUT" "$IN"
            rm -f "$RUNNER_TEMP/release.jks"
            echo "::notice::APK assinado com a chave de release."
          else
            OUT="../dist/nutriflow-${VERSION}-debug-signed.apk"
            cp "$IN" "$OUT"
            echo "::warning::Secrets de assinatura ausentes: APK assinado com a chave de debug."
          fi
          "$BT/apksigner" verify --print-certs "$OUT" | grep -E "Signer #1 certificate (DN|SHA-256)"
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: nutriflow-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
